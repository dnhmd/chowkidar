services:
  postgres:
    image: postgres:16-alpine
    container_name: chowkidar-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chowkidar_user
      POSTGRES_PASSWORD: chowkidar_password
      POSTGRES_DB: chowkidar_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chowkidar-network

  redis:
    image: redis:7.2-alpine
    container_name: chowkidar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chowkidar-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: chowkidar-gateway
    ports:
      - "8080:8080"
    environment:
      DB_URL: r2dbc:postgresql://chowkidar-postgres:5432/chowkidar_db
      M_DB_URL: jdbc:postgresql://chowkidar-postgres:5432/chowkidar_db
      DB_USERNAME: chowkidar_user
      DB_PASSWORD: chowkidar_password
      REDIS_HOST: chowkidar-redis
      REDIS_PORT: 6379
      HMAC_SECRET: change-this-in-production
    depends_on:
      - postgres
      - redis
    networks:
      - chowkidar-network

volumes:
  postgres_data:
  redis_data:

networks:
  chowkidar-network:
    driver: bridge